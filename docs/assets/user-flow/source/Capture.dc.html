<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拍和牌者的牌</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121211; color: #ffffff; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; padding: 56px 0 0; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
    <a href="Table.dc.html" aria-label="关闭" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">谁和了？</span>
    <button aria-label="闪光灯" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: flex-end; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>
    </button>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 20px 0; justify-content: center">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
      <button onClick="{{p.pick}}" style="height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.ink}}; font-size: 14px; font-weight: 600; font-family: inherit">{{p.name}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; position: relative; margin-top: 18px; background: #262a26">
    <div style="position: absolute; inset: 0; background: #2b302b"></div>
    <div style="position: absolute; left: 18px; right: 18px; top: 190px; height: 120px">
      <div style="position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-left: 3px solid #ffffff; border-top: 3px solid #ffffff; border-top-left-radius: 12px"></div>
      <div style="position: absolute; right: 0; top: 0; width: 26px; height: 26px; border-right: 3px solid #ffffff; border-top: 3px solid #ffffff; border-top-right-radius: 12px"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 26px; height: 26px; border-left: 3px solid #ffffff; border-bottom: 3px solid #ffffff; border-bottom-left-radius: 12px"></div>
      <div style="position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; border-right: 3px solid #ffffff; border-bottom: 3px solid #ffffff; border-bottom-right-radius: 12px"></div>
      <div style="position: absolute; left: 14px; right: 14px; top: 34px; display: flex; gap: 1px; justify-content: center">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="14">
          <div style="width: 22px; height: 30px; border-radius: 3px; background: #f4f1e8; box-shadow: 0 3px 0 #b9b39f; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
            <span style="font-size: 11px; font-weight: 700; color: #141413">{{t.top}}</span>
            <span style="font-size: 7px; color: {{t.color}}; margin-top: 1px">{{t.bot}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 340px; display: flex; justify-content: center; gap: 8px">
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
        <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; background: rgba(0,0,0,0.45); border-radius: 999px; padding: 6px 11px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8fd3ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          {{c}}
        </span>
      </sc-for>
    </div>
    <p style="position: absolute; left: 32px; right: 32px; top: 96px; margin: 0; text-align: center; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.86)">手牌推倒排一排，和的那张放最右<br>吃碰杠放旁边，暗杠翻开一张再拍</p>
  </div>

  <div style="height: 170px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px 20px">
    <button aria-label="从相册选" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-9 9"></path></svg>
    </button>
    <a href="Confirm.dc.html" aria-label="拍照" style="width: 78px; height: 78px; border-radius: 50%; border: 4px solid #ffffff; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <span style="width: 62px; height: 62px; border-radius: 50%; background: #ffffff"></span>
    </a>
    <a href="Details.dc.html" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(255,255,255,0.86)">手输</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { who: '杨' }; }
  renderVals() {
    const NUM = '一二三四五六七八九';
    const SUIT = { m: ['萬', '#9e2a47'], s: ['条', '#1d6344'], p: ['饼', '#25549c'] };
    const tile = (c) => { const [bot, color] = SUIT[c[1]]; return { top: NUM[+c[0] - 1], bot, color }; };
    const tiles = ['2m','2m','3m','3m','4m','4m','5m','5m','6m','7m','7m','8m','8m','9m'].map(tile);
    const players = ['小周', '阿明', '杨', '老陈'].map((name) => {
      const on = this.state.who === name;
      return { name, bg: on ? '#ffffff' : 'transparent', ink: on ? '#141413' : '#ffffff', border: on ? '#ffffff' : 'rgba(255,255,255,0.3)', pick: () => this.setState({ who: name }) };
    });
    return { tiles, players, checks: ['牌数对', '光线够', '对焦清楚'] };
  }
}
</script>
</body>
</html>
