<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#141413;text-decoration:none}a:hover{color:#141413}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf9f5; color: #141413; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; padding: 64px 20px 32px; display: flex; flex-direction: column; gap: 28px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; letter-spacing: 0.08em; color: #6b6963; font-weight: 500">国标麻将</span>
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">牌局</h1>
    </div>
    <button aria-label="设置" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #e6e4dd; background: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <a href="Table.dc.html" style="display: flex; flex-direction: column; gap: 18px; background: #ffffff; border: 1px solid #e6e4dd; border-radius: 18px; padding: 20px; box-shadow: 0 1px 2px rgba(20,20,19,0.04)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #1d6344"></span>
        <span style="font-size: 13px; font-weight: 600; color: #1d6344">进行中</span>
        <span style="font-size: 13px; color: #6b6963">· 东风圈 第 3 局</span>
      </div>
      <span style="font-size: 13px; color: #6b6963">今晚 20:14</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #575652">{{p.name}}</span>
          <span style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{p.color}}">{{p.score}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #efede7; padding-top: 14px">
      <span style="font-size: 13px; color: #6b6963">已打 2 局 · 1 分 1 元</span>
      <span style="font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px">继续
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
    </div>
  </a>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; letter-spacing: 0.08em; color: #6b6963; font-weight: 500">历史</span>
    <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 18px; display: flex; flex-direction: column">
      <sc-for list="{{history}}" as="h" hint-placeholder-count="4">
        <a href="Ledger.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-top: {{h.border}}">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 600">{{h.date}}</span>
            <span style="font-size: 13px; color: #6b6963">{{h.meta}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
            <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{h.color}}">{{h.mine}}</span>
            <span style="font-size: 12px; color: #6b6963">我</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <a href="NewGame.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 34px; height: 56px; border-radius: 16px; background: #141413; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    开新局
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = (v) => v > 0 ? '#1d6344' : (v < 0 ? '#9e2a47' : '#141413');
    const fmt = (v) => v > 0 ? '+' + v : String(v);
    const players = [['杨', 24], ['阿明', 32], ['小周', -32], ['老陈', -24]]
      .map(([name, s]) => ({ name, score: fmt(s), color: tone(s) }));
    const history = [
      ['10月19日 周六', '16 局 · 杨 阿明 小周 老陈', 86],
      ['10月12日 周六', '12 局 · 杨 阿明 小周 老陈', -42],
      ['10月5日 周日', '20 局 · 杨 阿明 Lily 老陈', 15],
      ['9月28日 周六', '8 局 · 杨 阿明 小周 老陈', -64]
    ].map(([date, meta, v], i) => ({ date, meta, mine: fmt(v), color: tone(v), border: i ? '1px solid #efede7' : 'none' }));
    return { players, history };
  }
}
</script>
</body>
</html>
