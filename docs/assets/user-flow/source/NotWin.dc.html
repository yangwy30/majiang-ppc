<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>不成和</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#141413;text-decoration:none}a:hover{color:#141413}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf9f5; color: #141413; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center">
    <a href="Confirm.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 20px">
    <span style="width: 48px; height: 48px; border-radius: 14px; background: #fef6e6; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8f5b14" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>
    </span>
    <h1 style="margin: 8px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">这手牌还不能和</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #575652">按现在的 14 张，凑不出 4 组 + 1 对。<br>最可能是第 10 张认错了。</p>
  </div>

  <div style="display: flex; gap: 2px; justify-content: center; background: #ffffff; border: 1px solid #e6e4dd; border-radius: 16px; padding: 18px 8px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="14">
      <div style="width: 22px; height: 32px; border-radius: 4px; background: #ffffff; border: {{t.ring}}; box-shadow: 0 2px 0 #e2dfd6; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
        <span style="font-size: 12px; font-weight: 700; color: #141413">{{t.top}}</span>
        <span style="font-size: 8px; font-weight: 600; color: #9e2a47; margin-top: 2px">萬</span>
      </div>
    </sc-for>
  </div>

  <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 34px; height: 46px; border-radius: 6px; border: 1px solid #d1cfc7; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; opacity: 0.55">
        <span style="font-size: 16px; font-weight: 700; color: #141413">九</span><span style="font-size: 10px; font-weight: 600; color: #9e2a47; margin-top: 2px">萬</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6963" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      <span style="width: 34px; height: 46px; border-radius: 6px; border: 2px solid #141413; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
        <span style="font-size: 16px; font-weight: 700; color: #141413">七</span><span style="font-size: 10px; font-weight: 600; color: #9e2a47; margin-top: 2px">萬</span>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 15px; font-weight: 600">改成七万就能和</span>
      <span style="font-size: 13px; color: #6b6963">清一色 · 平和，约 32 番</span>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
    <a href="Details.dc.html" style="height: 56px; border-radius: 16px; background: #141413; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">改成七万</a>
    <a href="Confirm.dc.html" style="height: 52px; border-radius: 16px; border: 1px solid #e6e4dd; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">自己再看看</a>
    <button style="height: 44px; border: none; background: none; font-size: 13px; font-family: inherit; color: #9e2a47">确实和错了 · 记错和，赔三家各 10 分</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const NUM = '一二三四五六七八九';
    const hand = [2, 2, 3, 3, 4, 4, 5, 5, 6, 9, 7, 8, 8, 9];
    const tiles = hand.map((n, i) => ({ top: NUM[n - 1], ring: i === 9 ? '1.5px solid #8f5b14' : '1px solid #d1cfc7' }));
    return { tiles };
  }
}
</script>
</body>
</html>
