<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>确认牌面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#141413;text-decoration:none}a:hover{color:#141413}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf9f5; color: #141413; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Capture.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">杨 的牌</span>
    <a href="Capture.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #575652">重拍</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">{{headline}}</h1>
    <span style="font-size: 14px; color: #6b6963">{{subline}}</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 6px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="14">
      <button onClick="{{t.tap}}" aria-label="{{t.label}}" style="position: relative; height: 60px; padding: 0; border-radius: 8px; background: #ffffff; border: {{t.ring}}; box-shadow: 0 3px 0 #e2dfd6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: inherit; line-height: 1">
        <span style="font-size: 20px; font-weight: 700; color: {{t.c1}}">{{t.top}}</span>
        <span style="font-size: 11px; color: {{t.color}}; margin-top: 3px">{{t.bot}}</span>
        <sc-if value="{{t.flag}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: -7px; right: -6px; width: 18px; height: 18px; border-radius: 9px; background: #8f5b14; color: #ffffff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">?</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <button style="border: none; background: none; padding: 8px 0; font-size: 13px; font-weight: 600; font-family: inherit; color: #141413; display: flex; align-items: center; gap: 6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="7" height="10" rx="1.5"></rect><rect x="14" y="7" width="7" height="10" rx="1.5"></rect></svg>
      标记吃 / 碰 / 杠
    </button>
    <span style="font-size: 12px; color: #6b6963">点任意一张可改</span>
  </div>

  <sc-if value="{{showPicker}}" hint-placeholder-val="{{true}}">
    <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(20,20,19,0.06)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 600">{{pickerTitle}}</span>
        <span style="font-size: 12px; font-weight: 600; color: #8f5b14; background: #fef6e6; border-radius: 6px; padding: 3px 8px">两次识别不一致</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
          <button onClick="{{o.pick}}" style="height: 92px; border-radius: 14px; border: {{o.ring}}; background: #faf9f5; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: inherit; padding: 0">
            <span style="width: 40px; height: 54px; border-radius: 7px; background: #ffffff; border: 1px solid #d1cfc7; box-shadow: 0 3px 0 #e2dfd6; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
              <span style="font-size: 18px; font-weight: 700; color: #141413">{{o.top}}</span>
              <span style="font-size: 12px; font-weight: 600; color: #9e2a47; margin-top: 3px">萬</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
              <span style="font-size: 15px; font-weight: 600; color: #141413">{{o.name}}</span>
              <span style="font-size: 12px; color: {{o.hintColor}}; font-weight: 500">{{o.hint}}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <button style="border: none; background: none; padding: 4px 0; font-size: 13px; font-family: inherit; color: #575652; text-align: left">都不是，选其他牌</button>
    </div>
  </sc-if>

  <sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
    <div style="background: #eaf5ef; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d6344" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      <span style="font-size: 14px; color: #1d6344; font-weight: 500">牌型成立：4 组顺子 + 1 对将</span>
    </div>
  </sc-if>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <sc-if value="{{canNext}}" hint-placeholder-val="{{false}}">
      <a href="Details.dc.html" style="height: 56px; border-radius: 16px; background: #141413; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">下一步</a>
    </sc-if>
    <sc-if value="{{wrong}}" hint-placeholder-val="{{false}}">
      <a href="NotWin.dc.html" style="height: 56px; border-radius: 16px; background: #141413; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">下一步</a>
    </sc-if>
    <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
      <span style="height: 56px; border-radius: 16px; background: #e6e4dd; color: #6b6963; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">还有 {{left}} 张待确认</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picks: {}, active: 9 }; }
  renderVals() {
    const NUM = '一二三四五六七八九';
    const hand = ['2m','2m','3m','3m','4m','4m','5m','5m','6m','7m','7m','8m','8m','9m'];
    const flags = { 9: ['7m', '9m'], 12: ['8m', '6m'] };
    const { picks, active } = this.state;
    const tiles = hand.map((c, i) => {
      const flagged = flags[i] && !picks[i];
      const code = picks[i] || c;
      const isActive = active === i && flags[i];
      return {
        top: flagged ? '?' : NUM[+code[0] - 1], bot: flagged ? '' : '萬',
        color: flagged ? '#8f5b14' : '#9e2a47', c1: flagged ? '#8f5b14' : '#141413',
        flag: flagged,
        label: '第 ' + (i + 1) + ' 张',
        ring: isActive ? '2px solid #141413' : (flagged ? '1.5px dashed #8f5b14' : '1px solid #d1cfc7'),
        tap: () => this.setState({ active: i })
      };
    });
    const left = Object.keys(flags).filter((k) => !picks[k]).length;
    const wrong = left === 0 && Object.keys(flags).some((k) => picks[k] !== flags[k][0]);
    const allDone = left === 0 && !wrong;
    const showPicker = !!flags[active];
    const opts = showPicker ? flags[active] : [];
    const options = opts.map((c, j) => ({
      top: NUM[+c[0] - 1], name: NUM[+c[0] - 1] + '万',
      hint: j === 0 ? '这张才能和' : '选它不成和',
      hintColor: j === 0 ? '#1d6344' : '#6b6963',
      ring: picks[active] === c ? '2px solid #141413' : '1px solid #e6e4dd',
      pick: () => {
        const np = { ...picks, [active]: c };
        const next = Object.keys(flags).map(Number).find((k) => !np[k]);
        this.setState({ picks: np, active: next === undefined ? -1 : next });
      }
    }));
    return {
      tiles, options, showPicker, allDone, wrong, left,
      canNext: allDone, pending: left > 0,
      pickerTitle: '第 ' + (active + 1) + ' 张是哪张？',
      headline: left > 0 ? '有 ' + left + ' 张不太确定' : (wrong ? '再看一眼' : '没问题'),
      subline: left > 0 ? '其余 12 张两次识别结果一致' : (wrong ? '这样摆不成和，点下一步看原因' : '14 张已确认，清一色')
    };
  }
}
</script>
</body>
</html>
