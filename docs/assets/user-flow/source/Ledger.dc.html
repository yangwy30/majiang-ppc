<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>账本</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#141413;text-decoration:none}a:hover{color:#141413}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf9f5; color: #141413; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Table.dc.html" aria-label="返回牌桌" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">账本</span>
    <a href="Settle.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #9e2a47">结束</a>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{totals}}" as="p" hint-placeholder-count="4">
      <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #575652">{{p.name}}</span>
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: {{p.color}}">{{p.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 18px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 1.6fr repeat(4, minmax(0, 1fr)); padding: 12px 16px; border-bottom: 1px solid #efede7; font-size: 12px; color: #6b6963">
      <span>局</span><span style="text-align: right">杨</span><span style="text-align: right">阿明</span><span style="text-align: right">小周</span><span style="text-align: right">老陈</span>
    </div>
    <sc-for list="{{rounds}}" as="r" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 1.6fr repeat(4, minmax(0, 1fr)); align-items: center; padding: 14px 16px; border-top: {{r.border}}">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">{{r.title}}</span>
          <span style="font-size: 12px; color: #6b6963">{{r.meta}}</span>
        </div>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
          <span style="text-align: right; font-size: 14px; font-weight: {{c.weight}}; font-variant-numeric: tabular-nums; color: {{c.color}}">{{c.v}}</span>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <span style="font-size: 12px; color: #6b6963; text-align: center">左滑某一局可以修改或撤销</span>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="Table.dc.html" style="height: 56px; border-radius: 16px; background: #141413; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">下一局 · 第 4 局</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = (v) => v > 0 ? '#1d6344' : (v < 0 ? '#9e2a47' : '#141413');
    const fmt = (v) => v > 0 ? '+' + v : String(v);
    const totals = [['杨', 144], ['阿明', -8], ['小周', -72], ['老陈', -64]].map(([name, v]) => ({ name, v: fmt(v), color: tone(v) }));
    const rounds = [
      ['3 · 杨 自摸', '清一色 · 32 番', [120, -40, -40, -40]],
      ['2 · 杨 和', '老陈点炮 · 8 番', [32, -8, -8, -16]],
      ['1 · 阿明 和', '小周点炮 · 16 番', [-8, 40, -24, -8]]
    ].map(([title, meta, vs], i) => ({
      title, meta, border: i ? '1px solid #efede7' : 'none',
      cells: vs.map((v) => ({ v: fmt(v), color: v > 0 ? '#1d6344' : '#575652', weight: v > 0 ? '600' : '400' }))
    }));
    return { totals, rounds };
  }
}
</script>
</body>
</html>
