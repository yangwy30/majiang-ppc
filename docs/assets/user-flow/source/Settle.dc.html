<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>结束牌局</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#141413;text-decoration:none}a:hover{color:#141413}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf9f5; color: #141413; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Ledger.dc.html" aria-label="返回账本" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="width: 44px"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; letter-spacing: 0.08em; color: #6b6963; font-weight: 500">10月26日 · 3 局 · 1 分 1 元</span>
    <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">杨 赢了 144</h1>
  </div>

  <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 18px">
    <sc-for list="{{rank}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: {{p.border}}">
        <span style="width: 18px; font-size: 14px; color: #6b6963; font-variant-numeric: tabular-nums">{{p.i}}</span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">{{p.name}}</span>
        <span style="font-size: 12px; color: #6b6963">{{p.wins}}</span>
        <span style="width: 64px; text-align: right; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{p.color}}">{{p.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; letter-spacing: 0.08em; color: #6b6963; font-weight: 500">这样转账最少</span>
    <div style="background: #ffffff; border: 1px solid #e6e4dd; border-radius: 18px">
      <sc-for list="{{transfers}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: {{t.border}}">
          <span style="font-size: 15px; font-weight: 500; min-width: 36px">{{t.from}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6963" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 500">{{t.to}}</span>
          <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">¥{{t.amt}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 8px">
    <span style="flex: 1; background: #f3f1eb; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 12px; color: #6b6963">最大的一手</span>
      <span style="font-size: 14px; font-weight: 600">清一色 32 番</span>
    </span>
    <span style="flex: 1; background: #f3f1eb; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 12px; color: #6b6963">点炮最多</span>
      <span style="font-size: 14px; font-weight: 600">老陈、小周 各 1</span>
    </span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 56px; border: none; border-radius: 16px; background: #141413; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; font-family: inherit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
      发到群里
    </button>
    <a href="Main.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #575652">回首页</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = (v) => v > 0 ? '#1d6344' : (v < 0 ? '#9e2a47' : '#141413');
    const fmt = (v) => v > 0 ? '+' + v : String(v);
    const rank = [['杨', 144, '和 2'], ['阿明', -8, '和 1'], ['老陈', -64, ''], ['小周', -72, '']]
      .map(([name, v, wins], i) => ({ i: i + 1, name, wins, v: fmt(v), color: tone(v), border: i ? '1px solid #efede7' : 'none' }));
    const transfers = [['小周', '杨', 72], ['老陈', '杨', 64], ['阿明', '杨', 8]]
      .map(([from, to, amt], i) => ({ from, to, amt, border: i ? '1px solid #efede7' : 'none' }));
    return { rank, transfers };
  }
}
</script>
</body>
</html>
